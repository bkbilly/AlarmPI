name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Configuration Init
      run: |
        cp config/settings_template.json config/settings.json
        cp config/server_template.json config/server.json
        cp play_template.wav play.wav

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all warnings as non-fatal
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

    - name: Verify Python compilation
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "*/.*/*")
