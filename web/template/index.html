<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#0b0f19">
	<title>AlarmPI - Smart Security System</title>
	<link rel="icon" sizes="192x192" href="{{ url_for('static', filename='icon.png') }}">

	<!-- Scripts & Styles -->
	<script src="{{ url_for('static', filename='jquery.js') }}"></script>
	<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
	<script src="{{ url_for('static', filename='vis-timeline-graph2d.min.js') }}"></script>
	<link rel="stylesheet" href="{{ url_for('static', filename='vis-timeline-graph2d.min.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='mycss.css') }}">
	<script src="{{ url_for('static', filename='myjs.js') }}"></script>
</head>

<body>
	<!-- Audio Alert for Triggered State -->
	<audio id="audioalert" loop>
		<source src="{{ url_for('static', filename='play_alert.mp3') }}" type="audio/mpeg">
	</audio>

	<!-- Header Bar -->
	<header class="app-header">
		<div class="brand-container">
			<div class="brand-icon">🛡️</div>
			<div class="brand-title">AlarmPI System</div>
		</div>
		<div class="header-actions">
			<button class="btn-icon" title="Sensor Timeline" onclick="openTimelineModal()">📊</button>
			<button class="btn-icon" title="System Settings" onclick="openSettingsModal()">⚙️</button>
			<button class="btn-icon" title="Logout" onclick="logout()">🚪</button>
		</div>
	</header>

	<!-- Main Layout -->
	<main class="app-container">
		<!-- Alarm Hero Controller Card -->
		<section class="hero-control-section">
			<div class="hero-alarm-card">
				<div class="alarm-status-ring" id="alarmRing">
					<div class="alarm-icon" id="alarmIcon">🔓</div>
				</div>
				<h2 class="alarm-state-label" id="alarmLabel">Disarmed</h2>
				<p class="alarm-state-subtitle" id="alarmSubtitle">System is disarmed. Standby mode.</p>
				
				<button class="btn-primary-action btn-arm" id="alarmActionBtn" onclick="handleMainAlarmAction()">
					<span>🛡️</span> Arm Alarm (Away)
				</button>

				<!-- Dynamic Zone Arm Buttons (Rendered only for zones that exist in sensors) -->
				<div class="zone-buttons-container" id="heroZoneButtonsContainer">
					<!-- Dynamically populated via myjs.js -->
				</div>

				<button class="btn-siren-test" onclick="toggleSirenTest()">🔊 Sound Siren Test</button>
			</div>
		</section>

		<!-- Protected Sensors Grid -->
		<section class="main-content">
			<!-- Sensors Dynamic Grid -->
			<div class="sensors-grid" id="sensorsGrid">
				<!-- Dynamically populated via myjs.js -->
			</div>
		</section>

		<!-- Live Activity Log Section -->
		<section class="activity-log-section">
			<div class="activity-card">
				<div class="activity-header">
					<h3 class="card-title"><span>📋</span> Activity Log</h3>
					<button class="btn-icon" style="width: 32px; height: 32px; font-size: 14px;" onclick="openTimelineModal()" title="View Visual Timeline">📊</button>
				</div>
				<div class="log-filters">
					<select id="logtype" class="select-filter" style="flex: 1;">
						<option value="all" selected>All Events</option>
						<option value="sensor">Sensors</option>
						<option value="alarm">Alarm Breaches</option>
						<option value="user_action">User Actions</option>
						<option value="system">System</option>
					</select>
					<select id="loglimit" class="select-filter" style="width: 75px;">
						<option value="15">15</option>
						<option value="30" selected>30</option>
						<option value="60">60</option>
						<option value="100">100</option>
					</select>
				</div>
				<ul class="activity-list" id="activityList">
					<li class="activity-item" style="color: var(--text-muted); text-align: center;">Loading activity history...</li>
				</ul>
			</div>
		</section>
	</main>

	<!-- Floating Action Button for Adding Sensors -->
	<button class="fab-btn" title="Add New Sensor" onclick="openAddSensorModal()">+</button>

	<!-- ==========================================================================
	     Dynamic Settings Modal (Populated Dynamically from Backend Schema)
	     ========================================================================== -->
	<div class="modal-backdrop" id="settingsModalBackdrop">
		<div class="modal-dialog" style="max-width: 850px;">
			<div class="modal-header">
				<h3 class="modal-title"><span>⚙️</span> System & Plugin Settings</h3>
				<button class="modal-close-btn" onclick="closeAllModals()">&times;</button>
			</div>
			
			<div class="modal-body">
				<!-- Dynamic Section Tabs Nav (Wrapped without horizontal scrollbar) -->
				<nav class="settings-tabs-nav" id="settingsTabsNav">
					<!-- Dynamically populated from backend sections -->
				</nav>

				<!-- Dynamic Tab Panes -->
				<div id="settingsTabContent">
					<!-- Dynamically populated from backend fields -->
				</div>
			</div>

			<div class="modal-footer">
				<button class="btn-secondary" onclick="closeAllModals()">Cancel</button>
				<button class="btn-primary-action btn-arm" style="width: auto; padding: 10px 24px;" onclick="saveDynamicSettings()">
					Save Changes
				</button>
			</div>
		</div>
	</div>

	<!-- ==========================================================================
	     Dynamic Sensor Modal (Add / Edit) with Interactive Zone Tag Selector
	     ========================================================================== -->
	<div class="modal-backdrop" id="sensorModalBackdrop">
		<div class="modal-dialog">
			<div class="modal-header">
				<h3 class="modal-title" id="sensorModalTitle"><span>🔌</span> Sensor Configuration</h3>
				<button class="modal-close-btn" onclick="closeAllModals()">&times;</button>
			</div>
			
			<div class="modal-body">
				<input type="hidden" id="sensorModalId">

				<div class="form-grid">
					<div class="form-group">
						<label class="form-label">Sensor Name</label>
						<input type="text" class="form-control" id="sensorInputName" placeholder="e.g. Front Door Magnet">
					</div>
					<div class="form-group">
						<label class="form-label">Sensor Type</label>
						<select class="form-control" id="sensorTypeSelect">
							<!-- Dynamically populated from backend available sensor types -->
						</select>
					</div>
					<div class="form-group">
						<label class="form-label">Behavior</label>
						<select class="form-control" id="sensorInputBehavior">
							<option value="normal" selected>Normal (Armed only)</option>
							<option value="entry_exit">Entry / Exit (Delay Countdown)</option>
							<option value="instant">Instant Breach (No Delay)</option>
							<option value="24hours">24-Hours (Always Active, Smoke/Tamper)</option>
							<option value="chime">Chime (Ding when Disarmed)</option>
						</select>
					</div>

					<!-- GitHub-Style Interactive Zone Tag Selector -->
					<div class="form-group full-width" style="position: relative;">
						<label class="form-label">Assigned Zones / Tags</label>
						<div class="github-topic-input-container" id="githubTopicContainer" onclick="focusZoneInput()">
							<div class="github-topic-tags" id="sensorActiveZonesContainer"></div>
							<input type="text" class="github-topic-input" id="sensorZoneNewInput" placeholder="Type to search or create tag..." autocomplete="off">
						</div>
						<!-- Autocomplete Dropdown List -->
						<div class="github-topic-dropdown" id="zoneAutocompleteDropdown" style="display: none;"></div>
					</div>
				</div>

				<!-- Dynamic Fields for chosen Sensor Type -->
				<div id="sensorDynamicFields" class="form-grid" style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 16px;">
					<!-- Dynamically populated from backend type schema -->
				</div>

				<!-- Sensor Activity History -->
				<div style="margin-top: 10px;">
					<h4 style="font-size: 0.9rem; margin-bottom: 8px; color: var(--text-secondary);">Recent Sensor Activity</h4>
					<div id="sensorDetailLogs" style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); max-height: 140px; overflow-y: auto; padding: 6px;">
						<div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 10px;">No recent events for this sensor</div>
					</div>
				</div>
			</div>

			<div class="modal-footer">
				<button class="btn-danger" id="sensorDeleteBtn" style="margin-right: auto; display: none;">Delete Sensor</button>
				<button class="btn-secondary" onclick="closeAllModals()">Cancel</button>
				<button class="btn-primary-action btn-arm" style="width: auto; padding: 10px 24px;" onclick="saveSensorFromModal()">
					Save Sensor
				</button>
			</div>
		</div>
	</div>

	<!-- ==========================================================================
	     Sensor Visual Timeline Modal (Modernized)
	     ========================================================================== -->
	<div class="modal-backdrop" id="timelineModalBackdrop">
		<div class="modal-dialog" style="max-width: 950px;">
			<div class="modal-header">
				<h3 class="modal-title"><span>📊</span> Sensor Timeline Analysis</h3>
				<button class="modal-close-btn" onclick="closeAllModals()">&times;</button>
			</div>
			<div class="modal-body">
				<!-- Timeline Toolbar & Stats -->
				<div class="timeline-toolbar">
					<div class="timeline-stats">
						<span class="timeline-stat-badge" id="timelineTotalEvents">Events: 0</span>
						<span class="timeline-stat-badge" id="timelineActiveSensors">Sensors: 0</span>
					</div>
					<div class="timeline-controls">
						<button class="btn-timeline-action" onclick="setTimelineWindow('1h')">1 Hour</button>
						<button class="btn-timeline-action" onclick="setTimelineWindow('24h')">24 Hours</button>
						<button class="btn-timeline-action" onclick="setTimelineWindow('7d')">7 Days</button>
						<button class="btn-timeline-action" onclick="fitTimelineView()">Fit View</button>
					</div>
				</div>

				<div id="timelineContainer" style="min-height: 380px;"></div>
			</div>
			<div class="modal-footer">
				<button class="btn-secondary" onclick="closeAllModals()">Close</button>
			</div>
		</div>
	</div>

	<!-- Toast Container -->
	<div class="toast-container" id="toastContainer"></div>
</body>
</html>
