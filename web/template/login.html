<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#0b0f19">
	<title>Login - AlarmPI</title>
	<link rel="icon" sizes="192x192" href="{{ url_for('static', filename='icon.png') }}">
	<style>
		:root {
			--bg-main: #0b0f19;
			--bg-card: #1e293b;
			--bg-input: #0f172a;
			--border-color: rgba(255, 255, 255, 0.1);
			--color-primary: #6366f1;
			--color-primary-hover: #4f46e5;
			--text-primary: #f8fafc;
			--text-secondary: #94a3b8;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background-color: var(--bg-main);
			background-image: 
				radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
				radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
			color: var(--text-primary);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.login-card {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 20px;
			padding: 36px 32px;
			width: 100%;
			max-width: 400px;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
			text-align: center;
		}

		.brand-logo {
			width: 60px;
			height: 60px;
			background: linear-gradient(135deg, var(--color-primary), #ec4899);
			border-radius: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 32px;
			margin: 0 auto 16px;
			box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
		}

		.brand-title {
			font-size: 1.5rem;
			font-weight: 800;
			margin-bottom: 6px;
			letter-spacing: -0.025em;
		}

		.brand-subtitle {
			font-size: 0.875rem;
			color: var(--text-secondary);
			margin-bottom: 28px;
		}

		.form-group {
			display: flex;
			flex-direction: column;
			gap: 6px;
			text-align: left;
			margin-bottom: 16px;
		}

		.form-label {
			font-size: 0.85rem;
			font-weight: 600;
			color: var(--text-secondary);
		}

		.form-control {
			background: var(--bg-input);
			border: 1px solid var(--border-color);
			color: var(--text-primary);
			padding: 12px 14px;
			border-radius: 10px;
			font-size: 0.95rem;
			outline: none;
			transition: all 0.2s;
			width: 100%;
		}

		.form-control:focus {
			border-color: var(--color-primary);
			box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
		}

		.btn-submit {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, var(--color-primary), #4f46e5);
			color: white;
			border: none;
			border-radius: 10px;
			font-size: 1rem;
			font-weight: 700;
			cursor: pointer;
			margin-top: 8px;
			box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
			transition: all 0.2s;
		}

		.btn-submit:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
		}

		.btn-submit:active {
			transform: translateY(0);
		}
	</style>
</head>
<body>
	<div class="login-card">
		<div class="brand-logo">🛡️</div>
		<h1 class="brand-title">AlarmPI Login</h1>
		<p class="brand-subtitle">Enter your credentials to access security controls</p>
		
		<form method="post">
			<div class="form-group">
				<label class="form-label" for="email">Username</label>
				<input type="text" class="form-control" id="email" name="email" placeholder="Enter username" required autocomplete="username">
			</div>
			
			<div class="form-group">
				<label class="form-label" for="pw">Password</label>
				<input type="password" class="form-control" id="pw" name="pw" placeholder="Enter password" required autocomplete="current-password">
			</div>
			
			<button type="submit" class="btn-submit">Sign In</button>
		</form>
	</div>
</body>
</html>
